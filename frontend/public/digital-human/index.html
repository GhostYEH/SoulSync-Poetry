<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>CampusMate Digital Human</title>
  <style>
    html, body, #unity-container, #unity-canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    html, body, #unity-container, #unity-canvas { background: transparent !important; }
    #unity-canvas { display: block; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #315d58; font: 13px system-ui, sans-serif; background: rgba(232,241,237,.16); }
    #loading[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading">正在载入数字人…</div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const buildUrl = "Build";
    const config = {
      dataUrl: buildUrl + "/digital-human.data",
      frameworkUrl: buildUrl + "/digital-human.framework.js",
      codeUrl: buildUrl + "/digital-human.wasm",
      streamingAssetsUrl: "StreamingAssets",
      devicePixelRatio: Math.max(2, Math.min(window.devicePixelRatio || 1, 2)),
      webglContextAttributes: { alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: "high-performance" },
      companyName: "CampusMate",
      productName: "CampusMate Digital Human",
      productVersion: "0.1.0"
    };

    const script = document.createElement("script");
    script.src = buildUrl + "/digital-human.loader.js";
    script.onload = () => createUnityInstance(canvas, config, progress => {
      loading.textContent = `正在载入数字人… ${Math.round(progress * 100)}%`;
    }).then(instance => {
      loading.hidden = true;
      window.unityInstance = instance;
      window.digitalHumanUnityInstance = instance;
      const parentOrigin = window.location.origin;
      window.addEventListener("message", event => {
        if (event.origin !== parentOrigin || event.data?.source !== "campusmate") return;
        const { type, value } = event.data;
        if (type === "speech-level") instance.SendMessage("DigitalHuman", "SetLipSyncLevel", String(value));
        if (type === "speech-state") instance.SendMessage("DigitalHuman", value ? "StartAudioLipSync" : "StopSpeaking", "");
        if (type === "speech-stop") instance.SendMessage("DigitalHuman", "StopSpeaking", "");
      });
      window.parent.postMessage({ source: "campusmate-unity", type: "ready" }, parentOrigin);
    }).catch(error => {
      loading.textContent = "数字人载入失败";
      window.parent.postMessage({ source: "campusmate-unity", type: "error", message: String(error) }, window.location.origin);
    });
    document.body.appendChild(script);
  </script>
</body>
</html>
